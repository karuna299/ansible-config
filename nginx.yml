---
- name: Install and configure Nginx
  hosts: web
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Deploy custom index page
      copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head><title>Ansible Nginx</title></head>
          <body>
            <h1>Nginx installed and configured using Ansible</h1>
          </body>
          </html>

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes
